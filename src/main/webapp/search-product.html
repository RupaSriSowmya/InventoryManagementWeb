<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Search Product - Inventory Management</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .header {
            background: #222;
            color: white;
            padding: 20px;
            font-size: 24px;
        }

        .container {
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: white;
            min-height: calc(100vh - 68px);
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            padding: 15px 25px;
            text-decoration: none;
            color: #333;
        }

        .sidebar a:hover {
            background: #eee;
        }

        .content {
            padding: 30px;
            flex: 1;
        }

        .content h1 {
            margin-top: 0;
        }

        .search-card {
            background: white;
            width: 400px;
            padding: 25px;
            margin-top: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 18px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #1565c0;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="header">
        📦 Inventory Management System
    </div>

    <div class="container">

        <div class="sidebar">

            <a href="dashboard">🏠 Dashboard</a>

            <a href="products">📦 Products</a>

            <a href="add-product.html">➕ Add Product</a>

            <a href="stock-management.html">📊 Stock Management</a>

            <a href="low-stock">⚠ Low Stock</a>

            <a href="index.html">🚪 Logout</a>

        </div>

        <div class="content">

            <h1>🔍 Search Product</h1>

            <div class="search-card">

                <p>
                    Enter a product ID to view its details.
                </p>

                <form action="search-product" method="get">

                    <label>Product ID:</label>

                    <input
                        type="number"
                        name="id"
                        min="1"
                        required
                    >

                    <button type="submit">
                        🔍 Search
                    </button>

                </form>

            </div>

            <a class="back-link" href="products">
                ← Back to Products
            </a>

        </div>

    </div>

</body>

</html>
