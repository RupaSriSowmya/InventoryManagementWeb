<!DOCTYPE html>
<html>

<head>

    <title>Products - Inventory System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .header {
            background: #222;
            color: white;
            padding: 20px;
            font-size: 24px;
        }

        .container {
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: white;
            min-height: calc(100vh - 68px);
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            padding: 15px 25px;
            text-decoration: none;
            color: #333;
        }

        .sidebar a:hover {
            background: #eee;
        }

        .content {
            padding: 30px;
            flex: 1;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            padding: 10px;
            width: 250px;
        }

        table {
            width: 100%;
            margin-top: 25px;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit {
            background: #ddd;
        }

        .delete {
            background: #ddd;
        }

    </style>

</head>

<body>

    <div class="header">
        📦 Inventory Management System
    </div>

    <div class="container">

        <div class="sidebar">

            <a href="dashboard.html">🏠 Dashboard</a>

            <a href="products.html">📦 Products</a>

            <a href="#">➕ Add Product</a>

            <a href="#">📊 Stock Management</a>

            <a href="#">⚠ Low Stock</a>

            <a href="index.html">🚪 Logout</a>

        </div>


        <div class="content">

            <div class="top-bar">

                <h1>Products</h1>

                <input
                    type="text"
                    class="search-box"
                    placeholder="Search product..."
                >

            </div>


            <table>

                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>

                <tr>
                    <td>1</td>
                    <td>Keyboard</td>
                    <td>Electronics</td>
                    <td>1200</td>
                    <td>20</td>

                    <td>
                        <button class="edit">Edit</button>
                        <button class="delete">Delete</button>
                    </td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Mouse</td>
                    <td>Electronics</td>
                    <td>600</td>
                    <td>5</td>

                    <td>
                        <button class="edit">Edit</button>
                        <button class="delete">Delete</button>
                    </td>
                </tr>

            </table>

        </div>

    </div>

</body>

</html>
