<!DOCTYPE html>

<html>


<head>


<meta charset="UTF-8">


<title>
Inventory Management System - Login
</title>



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">



<style>


*{

box-sizing:border-box;

font-family:'Segoe UI',Arial,sans-serif;

}



body{


margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;


background:

linear-gradient(
135deg,
#2563eb,
#1e40af
);


}





.login-container{


width:420px;


background:white;


padding:40px;


border-radius:20px;


box-shadow:

0 15px 40px rgba(0,0,0,0.25);


}





.logo{


text-align:center;


margin-bottom:30px;


}



.logo i{


font-size:60px;


color:#2563eb;


}



.logo h1{


margin:15px 0 5px;


color:#1e293b;


font-size:28px;


}



.logo p{


color:#64748b;


}




.form-group{


margin-bottom:20px;


}



label{


font-weight:600;

color:#334155;


display:block;

margin-bottom:8px;


}



input{


width:100%;


padding:14px;


border-radius:10px;


border:1px solid #cbd5e1;


font-size:15px;


outline:none;


}



input:focus{


border-color:#2563eb;


box-shadow:

0 0 5px rgba(37,99,235,.4);


}





.login-btn{


width:100%;


padding:14px;


border:none;


border-radius:10px;


background:

linear-gradient(
135deg,
#2563eb,
#1e40af
);


color:white;


font-size:17px;


font-weight:600;


cursor:pointer;


transition:.3s;


}



.login-btn:hover{


transform:translateY(-2px);


opacity:.9;


}





.footer{


text-align:center;


margin-top:25px;


color:#64748b;


font-size:14px;


}




</style>



</head>




<body>





<div class="login-container">





<div class="logo">


<i class="fa-solid fa-boxes-stacked"></i>



<h1>

Inventory System

</h1>



<p>

Admin Login Portal

</p>



</div>








<form action="login" method="post">





<div class="form-group">


<label>

<i class="fa-solid fa-user"></i>

Username

</label>



<input

type="text"

name="username"

placeholder="Enter username"

required>


</div>








<div class="form-group">


<label>

<i class="fa-solid fa-lock"></i>

Password

</label>



<input

type="password"

name="password"

placeholder="Enter password"

required>


</div>







<button

type="submit"

class="login-btn">


<i class="fa-solid fa-right-to-bracket"></i>

Login


</button>






</form>








<div class="footer">


Inventory Management System

<br>

Secure Admin Access


</div>






</div>






</body>


</html>
