<!DOCTYPE html>

<html>


<head>


<meta charset="UTF-8">


<title>
Stock Management - Inventory System
</title>



<link rel="stylesheet" href="css/style.css">



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>



<body>




<!-- HEADER -->


<div class="header">


<div>

<i class="fa-solid fa-box"></i>

Inventory Management System

</div>



<div>


<a href="logout">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>


</div>


</div>







<div class="container">



<!-- SIDEBAR -->


<div class="sidebar">


<a href="dashboard">

<i class="fa-solid fa-house"></i>

Dashboard

</a>




<a href="products">

<i class="fa-solid fa-boxes-stacked"></i>

Products

</a>





<a href="add-product.jsp">

<i class="fa-solid fa-plus"></i>

Add Product

</a>





<a href="stock-management.html">

<i class="fa-solid fa-chart-line"></i>

Stock Management

</a>





<a href="low-stock">

<i class="fa-solid fa-triangle-exclamation"></i>

Low Stock

</a>





<a href="logout">

<i class="fa-solid fa-power-off"></i>

Logout

</a>


</div>










<!-- CONTENT -->


<div class="content">



<h1>

<i class="fa-solid fa-chart-line"></i>

Stock Management

</h1>








<div class="cards">





<!-- ADD STOCK -->


<div class="card">



<h2>

<i class="fa-solid fa-arrow-up"></i>

Add Stock

</h2>



<form action="add-stock" method="get">



<label>

Product ID

</label>



<input

type="number"

name="id"

placeholder="Enter product ID"

required>






<label>

Quantity to Add

</label>



<input

type="number"

name="amount"

placeholder="Enter quantity"

min="1"

required>







<button

type="submit"

class="btn btn-success">


<i class="fa-solid fa-plus"></i>

Add Stock


</button>



</form>



</div>









<!-- REDUCE STOCK -->


<div class="card">



<h2>

<i class="fa-solid fa-arrow-down"></i>

Reduce Stock

</h2>



<form action="reduce-stock" method="get">



<label>

Product ID

</label>



<input

type="number"

name="id"

placeholder="Enter product ID"

required>







<label>

Quantity to Reduce

</label>



<input

type="number"

name="amount"

placeholder="Enter quantity"

min="1"

required>







<button

type="submit"

class="btn btn-danger">


<i class="fa-solid fa-minus"></i>

Reduce Stock


</button>



</form>



</div>





</div>








<br>




<a href="products"

class="btn btn-primary">


<i class="fa-solid fa-arrow-left"></i>

Back to Products


</a>






</div>





</div>







</body>


</html>
